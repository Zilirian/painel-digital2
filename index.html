<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Digital</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="/imgs/background.jpg" type="image/x-icon" />
</head>
<body>
    
    <div class="central">
        <h1>Painel Digital</h1>

        <div class="relogio">
            <span id="horas">00</span>
            <span id="minutos">00</span>
            <span id="segundo">00</span>
        </div>

        <div class="data">
            <span id="dia">00</span>
            <span>/</span>
            <span id="mes">00</span>
            <span>/</span>
            <span id="ano">0000</span> 
        </div>


        <div class="data2">
            <div class="dia">
                <h2>Dia</h2>
                <span id="dia2">00</span>
            </div>
            <div class="mes">
                <h2>Mês</h2>
                <span id="mes2">00</span>
            </div>
            <div class="ano">
                <h2>Ano</h2>
                <span id="ano2">0000</span>
            </div>
        </div>

        <div class="mensagem" id="mensagem"></div>

        <div class="status">
            <span class="status-bolinha" id="status-bolinha"></span>
            <span>PAINEL ATUALIZADO AUTOMATICAMENTE</span>
        </div>

    </div>

    <script src="js/script.js"></script>
</body>
</html>
