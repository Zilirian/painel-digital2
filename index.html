<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width='device-width', initial-scale=1.0">
    <title>Calculadora de Valor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="imgs/icon.png" type="image/x-icon">
</head>
<body>
    
    <div class="central">
        <div class="sistema">
            <div class="cabecalho">
            <h1>CALCULADORA DE VALOR FINAL</h1>
            <img src="imgs/icon.png">
            </div>
            <div class="perguntas">
                <h2>Preço do produto(R$):</h2>
                <input type="text" placeholder="Ex: 200" id="pergunta1">
                <h2>Quantidade:</h2>
                <input type="text" placeholder="Ex: 2" id="pergunta2">
                <h2>Desconto(%):</h2>
                <input type="text" placeholder="Ex: 20" id="pergunta3">
            </div>
            <button id="btn">Calcular Valor Final</button>
            <div class="resposta">
                <span id="resposta"></span>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
